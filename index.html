<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MathBoost">
  <meta name="theme-color" content="#0b1020">
  <title>Math Brain Booster Pro</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20fill%3D%22%230b1020%22%2F%3E%3Ctext%20x%3D%2290%22%20y%3D%22120%22%20font-size%3D%22100%22%20fill%3D%22%23ff5c7a%22%20text-anchor%3D%22middle%22%20font-family%3D%22sans-serif%22%20font-weight%3D%22bold%22%3E%CF%80%3C%2Ftext%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- HOME -->
    <section id="screen-home" class="screen active">
      <h1>Math Brain Booster</h1>
      <p class="tag">Level <span id="home-level">1</span> · Best streak <span id="home-streak">0</span></p>
      <div class="menu">
        <button class="btn btn-primary" id="btn-play" type="button">Play</button>
        <button class="btn" id="btn-daily" type="button">Daily Challenge</button>
        <button class="btn" id="btn-stats" type="button">Stats</button>
      </div>
      <p class="footnote">Live API · adaptive 10 levels · algebra, trig, calculus</p>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen">
      <div class="hud">
        <div>Lv <span id="hud-level">1</span></div>
        <div>Score <span id="hud-score">0</span></div>
        <div>Q <span id="hud-q">1/10</span></div>
      </div>
      <div class="timer-bar"><div id="timer-fill"></div></div>

      <div id="loading-spinner" class="loading-spinner" style="display:none;">
        <div class="spinner"></div>
        <p>Fetching fresh questions…</p>
      </div>

      <div class="question" id="question">Loading...</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </section>

    <!-- RESULTS -->
    <section id="screen-results" class="screen">
      <h2 id="results-title">Great job!</h2>
      <div class="results-stats">
        <div><b id="res-correct">0</b><span>Correct</span></div>
        <div><b id="res-total">0</b><span>Total</span></div>
        <div><b id="res-score">0</b><span>Score</span></div>
        <div><b id="res-level">1</b><span>New level</span></div>
      </div>
      <div class="menu">
        <button class="btn btn-primary" id="btn-again" type="button">Play Again</button>
        <button class="btn" id="btn-home" type="button">Home</button>
      </div>
    </section>

    <!-- STATS -->
    <section id="screen-stats" class="screen">
      <h2>Your Progress</h2>
      <div id="stats-list"></div>
      <button class="btn" id="btn-back-home" type="button">Back</button>
    </section>

  </div>

  <div id="error-overlay" style="display:none; position:fixed; inset:0; background:#0b1020; color:#ff8fa3; padding:24px; font-family:monospace; font-size:13px; overflow:auto; z-index:9999;">
    <h2 style="color:#ff5c7a; margin-top:0;">⚠️ Something broke</h2>
    <pre id="error-msg" style="white-space:pre-wrap; word-break:break-word;"></pre>
    <p style="color:#9fb4e6; font-size:12px;">Screenshot this and share it.</p>
  </div>

  <script>
    window.addEventListener('error', function (e) {
      var overlay = document.getElementById('error-overlay');
      var msg = document.getElementById('error-msg');
      if (overlay && msg) {
        overlay.style.display = 'block';
        msg.textContent =
          (e.message || 'Unknown error') + '\n\n' +
          (e.filename || '') + ':' + (e.lineno || '?');
      }
    });
  </script>

  <script src="script.js"></script>
</body>
</html>
